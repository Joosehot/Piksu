[package]
name = "piksu"
version = "0.1.0"
edition = "2021"
description = "Piksu: describe a sprite in words, get deterministic pixel art and animation frames (a HotMotor engine)"
license = "MIT"
repository = "https://github.com/Joosehot/Piksu"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "piksu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[profile.dev]
opt-level = 1
