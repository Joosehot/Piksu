# ---------------------------------------------------------------- animation
# frames = default frame count; the rest are amplitudes in canvas fractions (angles in degrees).
[animations.idle]
frames = 6
bob = 0.03
fish = 0.4
breath = 0.012     # a sitting person's upper body rises this much with a breath         # an idle fish hovers in place: its swim at this share of the amplitude

[animations.bounce]
frames = 8
height = 0.14
squash = 0.2

[animations.walk]
frames = 8
step = 0.06
bob = 0.03
swing = 22.0       # realistic: degrees a leg turns from the hip (arms 70% of it, the other way)
height = 0.12      # realistic hop: how high a frog leaps
arm_foreshorten = 0.18   # realistic front view: an arm swinging forward looks this much shorter

[animations.fly]
frames = 8
flap = 38.0
flap_realistic = 20.0   # real wings sweep less, so the figure keeps its size
bob = 0.04

[animations.spin]
frames = 12
min_width = 0.12
max_change = 0.6       # a turning coin changes its silhouette a lot by nature

[animations.float]
frames = 8
drift = 0.06

[animations.blink]
frames = 6
closed_frame = 3

[animations.hurt]
frames = 4
shake = 0.05
flash = 0.7        # every other frame is washed this far towards white

# a fish swimming in place: the tail sweeps, the body behind `fish.bend_at` bends with it, the
# head answers a little the other way, the pectoral fins paddle
[animations.swim]
frames = 8
tail = 16.0        # degrees the tail fin turns at the tail root
body = 4.0         # degrees the rear of the body bends
head = 1.2         # degrees the whole fish turns against the bend
fin = 26.0         # degrees the pectoral fin paddles (the pelvic fin half of it)
lag = 0.15         # the tail follows the body this share of a loop later
bob = 0.012

# a hooked fish thrashing: it swings from the mouth and bends into a C, one way then the other
[animations.struggle]
frames = 6
thrash = 14.0      # degrees the fish swings around its mouth
body = 34.0        # degrees the rear bends against the swing
tail = 36.0        # the tail whips twice per bend
fin = 45.0
lag = 0.1
flash = 0.2        # the hardest pulls are washed this far towards white
flash_at = 0.95    # ... the frames where the bend is at least this share of its full swing
max_change = 0.55  # thrashing reshapes the silhouette more than walking

# a jig fluttering down after a twitch: it rocks around its eye, flashing at the steepest tilt
[animations.flutter]
frames = 8
tilt = 18.0        # degrees it swings each way around the eye
flash = 0.35       # the steepest frames are washed this far towards white (the metal catches the light)
flash_at = 0.95
max_change = 0.75  # a small thing swinging changes its silhouette a lot

[timing]
snappy_hold = 0.3      # fraction of the cycle held at each extreme

[lighting]
direction = [-0.55, -0.7, 0.45]   # towards the light: left, up, out of the screen
ambient = 0.2
levels = [0.3, 0.5, 0.72, 0.9]    # lit intensity cut-offs: deep | shade | main | light | spec
dither = 0.12                     # realistic: ordered dither width around each cut-off

[realism]
eye_scale = { cartoon = 1.0, stylized = 0.85, realistic = 0.62 }
saturation = { cartoon = 1.0, stylized = 0.92, realistic = 0.78 }
deep_value = 0.48
spec_value = 1.35
spec_saturation = 0.5
cloth_saturation = 0.55   # "dark green trousers" are dyed cloth, not paint
cloth_value = 0.72

# texture strength per material (realistic only; stylized gets half)
[materials]
fur = 0.1
skin = 0.07
metal = 0.05
gel = 0.05
cloth = 0.06
stone = 0.04
scales = 0.09                     # scales: the net of scale edges darkens this much
scale_px = 4
scales_min_size = 48
metal_band = [-0.5, -0.22]        # metal: a bright vertical streak between these x positions (-1..1)
gel_core = 0.12                   # gel: glow added in the middle

