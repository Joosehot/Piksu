slime = "black"
human = "brown"
dog = "brown"
fish = "silver"
perch = "gold"
roach = "red"
pike = "gold"

# ---------------------------------------------------------------- fish
# Colours of each kind (the body colour is default_color, or the sentence's). Fins and markings
# keep their colours when the body is recoloured: a perch is known by its red fins.
[fish]
bend_at = 0.5
stripes = 7
spots = 9
spines = 12
shade_drop = 0.6
detail_min_size = 48

[fish.fish]
tone = 1.0
back = [0.12, 0.2, 0.42]
back_mix = 0.55
belly = [0.92, 0.94, 0.97]
fins = [0.56, 0.66, 0.84]
upper_fins = [0.45, 0.56, 0.78]
markings = "none"
mark = [0.12, 0.18, 0.36]

[fish.perch]
tone = 1.0
back = [0.2, 0.28, 0.1]
back_mix = 0.45
belly = [0.95, 0.92, 0.76]
fins = [0.95, 0.36, 0.12]
upper_fins = [0.58, 0.6, 0.42]
markings = "stripes"
mark = [0.07, 0.09, 0.05]

[fish.roach]
tone = 1.0
back = [0.16, 0.26, 0.34]
back_mix = 0.7
belly = [0.97, 0.97, 0.98]
fins = [0.92, 0.32, 0.2]
upper_fins = [0.56, 0.44, 0.42]
markings = "none"
mark = [0.3, 0.36, 0.42]

[fish.pike]
tone = 0.82
back = [0.14, 0.2, 0.09]
back_mix = 0.6
belly = [0.92, 0.91, 0.78]
fins = [0.78, 0.46, 0.2]
upper_fins = [0.52, 0.48, 0.22]
markings = "spots"
mark = [0.9, 0.88, 0.52]

# ---------------------------------------------------------------- characters
# A name in a sentence stands for its description; the rest of the sentence still applies
# ("winston black, walking"). Descriptions use only the vocabulary.
[characters]
"ice fisherman" = "a realistic man with a red winter hat, a long blue coat, dark brown trousers, black boots and a brown belt"
"fisherman" = "a realistic man with a red winter hat, a long blue coat, dark brown trousers, black boots and a brown belt"
"ice angler" = "a realistic man with a red winter hat, a long blue coat, dark brown trousers, black boots and a brown belt"
"inuit ice fisher" = "a realistic person sitting, with a brown parka with the hood up and a cream fur ruff, dark brown mittens, dark brown trousers and brown kamik"
"inuk ice fisher" = "a realistic person sitting, with a brown parka with the hood up and a cream fur ruff, dark brown mittens, dark brown trousers and brown kamik"
"inuit fisher" = "a realistic person sitting, with a brown parka with the hood up and a cream fur ruff, dark brown mittens, dark brown trousers and brown kamik"
"winston black" = "a realistic man with black hair, a long brown coat, green eyes, a cream shirt with green stripes, a brown belt, dark green trousers, black boots and a black claw arm"

[shading]
shade_cut = 0.45       # top_light: (x + y) past this, in the part's own -1..1 box, is shade
light_cut = 0.75       # top_light: (x + y) below minus this is highlight
rim_band = 0.72        # rim: radius past this is the rim (shade low-right, light up-left)

# ---------------------------------------------------------------- checks
[checks]
min_fill = 0.12        # the silhouette covers at least this fraction of the canvas (frame 0)
min_fill_hanging = 0.015  # ... a hook or a jig: a thin thing centred on its eye, half the canvas left for its swing
max_fill = 0.85
min_contrast = 0.18    # luminance difference outline vs main, eyes vs main
max_change = 0.4       # at most this fraction of silhouette pixels change shape between frames (moves taken out)
max_step = 0.18        # the silhouette's centre moves at most this fraction of the canvas per frame
symmetry_tolerance = 0.06

# ---------------------------------------------------------------- output
[output]
preview_size = 512     # preview.png and the GIF are enlarged to about this many pixels
gif_frame_ms = 120
sheet_padding = 1
