# Fish: body = [centre x, centre y, length snout to tail root, depth]. The rest are shares of
# the body: t runs from the snout (0) to the tail root (1); heights are shares of the depth.
#   profile = [back's highest point t, belly's lowest point t, snout taper (0.5 round, >1 pointed),
#              depth at the tail root, share of the depth above the midline, depth at the snout tip]
#   head    = [head length (gill cover) t, eye radius, mouth length t, eye along the head,
#              eye height (0 midline, 1 the back)]
#   tail    = [length (share of length), height (share of depth), fork depth (0 square, 1 split)]
#   dorsal  = [from t, to t, height, spiny (1 = a row of spines), height at its rear]
#   dorsal2 = a second (soft) dorsal fin [from t, to t, height, height at its rear]
#   anal    = [from t, to t, height, height at its rear]
